<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f7f4ec"/>
  <meta name="description" content="BoscoSong, cancionero para coros y músicos"/>
  <title>BoscoSong · Cancionero</title>
  <style>
    #launch-status {max-width:640px;margin:11vh auto;padding:30px;color:#244e3e;font:16px/1.6 system-ui,sans-serif}
    #launch-status h1 {font-size:30px;margin:0 0 12px}
    #launch-status p {margin:0 0 12px}
    #launch-status a {color:#156a51}
    #launch-status code {background:#edf2ed;padding:2px 4px;border-radius:4px}
  </style>
  <script type="module" crossorigin src="/BoscoSong/assets/index-uOOv1V2N.js"></script>
  <link rel="stylesheet" crossorigin href="/BoscoSong/assets/index-BKmn_x57.css">
</head>
<body>
  <div id="root">
    <div id="launch-status" role="status">
      <h1>BoscoSong</h1>
      <p>Cargando el cancionero…</p>
      <p id="launch-diagnostic" hidden>
        La aplicación no ha podido iniciarse. Comprueba en
        <a href="https://github.com/CNAAAADB/BoscoSong/settings/pages">Settings → Pages</a>
        que <strong>Build and deployment → Source</strong> esté configurado como
        <strong>GitHub Actions</strong>, y no «Deploy from a branch».
        Después, recarga esta página.
      </p>
    </div>
  </div>
  <script>
    (function () {
      function showDiagnostic() {
        if (document.getElementById('launch-status')) {
          document.getElementById('launch-diagnostic').hidden = false;
        }
      }
      window.addEventListener('error', showDiagnostic);
      window.addEventListener('unhandledrejection', showDiagnostic);
      setTimeout(showDiagnostic, 9000);
    })();
  </script>
</body>
</html>
